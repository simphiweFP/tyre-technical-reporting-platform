name: Provider Smoke

on:
  workflow_dispatch:

jobs:
  providers:
    runs-on: ubuntu-latest
    environment: provider-smoke
    env:
      ENVIRONMENT: development
      DATABASE_URL: ${{ secrets.SMOKE_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3-flash-preview
      SMTP_HOST: smtp.office365.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: "true"
      EMAIL_FROM: ${{ secrets.SMTP_USERNAME }}
      EMAIL_FROM_NAME: Royal Tyres Technical Reports
      SMOKE_EMAIL_TO: ${{ secrets.SMOKE_EMAIL_TO }}
      JWT_SECRET: provider-smoke-only-secret-not-used-for-authentication
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify required provider secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$GEMINI_API_KEY"
          test -n "$SMTP_USERNAME"
          test -n "$SMTP_PASSWORD"
          test -n "$SMOKE_EMAIL_TO"
      - name: Test PostgreSQL, Gemini and Microsoft SMTP
        run: python scripts/provider_smoke.py
