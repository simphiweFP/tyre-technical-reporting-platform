services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tyre_reports
      POSTGRES_USER: tyre_app
      POSTGRES_PASSWORD: tyre_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyre_app -d tyre_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SMTP_HOST: mailpit
      REPORT_FILE_ROOT: /app/data/technical-reports
    volumes:
      - report_files:/app/data/technical-reports
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    command:
      [
        "sh",
        "-c",
        "alembic -c backend/alembic.ini upgrade head && python -m backend.app.seed && python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000",
      ]

  frontend:
    build:
      context: frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  delivery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      SMTP_HOST: mailpit
      REPORT_FILE_ROOT: /app/data/technical-reports
    volumes:
      - report_files:/app/data/technical-reports
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    command: ["python", "-m", "backend.app.worker"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  report_files:
