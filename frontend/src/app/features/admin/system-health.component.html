<section class="admin-page">
  <div class="crumb">Administration <b>›</b> System Health</div>
  <header class="admin-title">
    <div>
      <h1>System Health</h1>
      <p>Monitor the services required to capture, store and deliver technical reports.</p>
    </div>
    <button class="red-button" type="button" (click)="refresh()" [disabled]="loading()">
      {{ loading() ? 'Refreshing…' : '↻ Refresh' }}
    </button>
  </header>

  @if (message()) {
    <div class="notice error-notice">{{ message() }}</div>
  }

  @if (health(); as item) {
    <section class="settings-card">
      <header>
        <div>
          <h2>Platform Status</h2>
          <p>Live API dependencies and delivery processing state.</p>
        </div>
      </header>
      <div class="settings-grid">
        <label>
          <b>Overall status</b>
          <span class="healthy" [class.health-warning]="!healthy(item.status)">
            <i></i>{{ item.status }}
          </span>
        </label>
        <label>
          <b>Database</b>
          <span class="healthy" [class.health-warning]="!healthy(item.database)">
            <i></i>{{ item.database }}
          </span>
        </label>
        <label>
          <b>Report file storage</b>
          <span class="healthy" [class.health-warning]="!healthy(item.file_storage)">
            <i></i>{{ item.file_storage }}
          </span>
        </label>
        <label>
          <b>Delivery worker</b>
          <span class="healthy" [class.health-warning]="!healthy(item.delivery_worker)">
            <i></i>{{ item.delivery_worker }}
          </span>
        </label>
        <label>
          <b>Pending deliveries</b>
          <span>{{ item.pending_deliveries }}</span>
        </label>
        <label>
          <b>Retrying deliveries</b>
          <span>{{ item.retrying_deliveries }}</span>
        </label>
        <label>
          <b>Failed deliveries</b>
          <span>{{ item.failed_deliveries }}</span>
        </label>
        <label>
          <b>Delivery worker last seen</b>
          <span>
            {{ item.worker_last_seen_at ? (item.worker_last_seen_at | date: 'dd/MM/yyyy HH:mm:ss') : 'Not started' }}
          </span>
        </label>
        <label>
          <b>Oldest pending delivery</b>
          <span>
            {{ item.oldest_pending_at ? (item.oldest_pending_at | date: 'dd/MM/yyyy HH:mm:ss') : 'None' }}
          </span>
        </label>
      </div>
    </section>
  }
</section>
