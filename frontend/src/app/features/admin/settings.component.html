<section class="admin-page">
  <div class="crumb">Administration <b>›</b> System Settings</div>
  <header class="admin-title">
    <div>
      <h1>System Settings</h1>
      <p>Configure application preferences used by the technical reporting platform.</p>
    </div>
  </header>

  @if (message()) {
    <div class="notice">{{ message() }}</div>
  }

  @if (settings(); as s) {
    <section class="settings-card">
      <header>
        <div>
          <h2>Application Settings</h2>
          <p>Changes here affect how reports and platform services behave.</p>
        </div>
        <button class="save-button" (click)="save()">▣ &nbsp; Save Changes</button>
      </header>
      <div class="settings-grid">
        <label
          ><b>Company name</b
          ><input [ngModel]="s.company_name" (ngModelChange)="update('company_name', $event)"
        /></label>
        <label
          ><b>OCR confidence threshold</b
          ><input
            type="number"
            min="0"
            max="100"
            [ngModel]="s.ocr_confidence_threshold"
            (ngModelChange)="update('ocr_confidence_threshold', $event)"
        /></label>
        <label
          ><b>PDF template</b
          ><input [ngModel]="s.pdf_template" (ngModelChange)="update('pdf_template', $event)"
        /></label>
        <label
          ><b>Offline sync</b
          ><input
            type="checkbox"
            [ngModel]="s.offline_sync_enabled"
            (ngModelChange)="update('offline_sync_enabled', $event)"
        /></label>
        <label
          ><b>Sync interval (minutes)</b
          ><input
            type="number"
            min="1"
            max="1440"
            [ngModel]="s.offline_sync_minutes"
            (ngModelChange)="update('offline_sync_minutes', $event)"
        /></label>
        <label
          ><b>SMTP server</b
          ><input [ngModel]="s.smtp_server" (ngModelChange)="update('smtp_server', $event)"
        /></label>
      </div>
    </section>
  }
</section>
